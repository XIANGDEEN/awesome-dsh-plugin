url: https://github.com/XIANGDEEN/dsh-sidebar-video-player
name: XIANGDEEN/dsh-sidebar-video-player
category: ui
description:
  en: "A right-Sidebar video player with a folder playlist (first-frame thumbnails, duration badges, sort by name/duration/modified/size in either direction, click to switch and auto-advance), live playback telemetry (buffered range, decoded FPS, dropped frames) and a read-only MP4/MOV reader for codec profile/level, exact frame count, per-track bitrate and rotation. Registers no agent tool and writes no session events."
  zh: "右侧栏视频播放器：选择文件夹后用首帧缩略图和时长列出其中所有视频，支持按名称/时长/修改时间/大小升降序，点击切换、播完自动下一个；同时实时显示缓冲区间、解码帧率与丢帧，并只读解析 MP4/MOV 的编码档次/级别、精确帧数、每轨码率与旋转；不注册智能体工具，不写入会话事件。"
