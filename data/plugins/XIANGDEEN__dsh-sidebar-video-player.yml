url: https://github.com/XIANGDEEN/dsh-sidebar-video-player
name: XIANGDEEN/dsh-sidebar-video-player
category: ui
description:
  en: "A right-Sidebar video player with live playback telemetry (buffered range, decoded FPS, dropped frames) and a read-only MP4/MOV reader for codec profile/level, exact frame count, per-track bitrate and rotation. Plays local files or HTTP(S) URLs; registers no agent tool and writes no session events."
  zh: "右侧栏视频播放器：播放本地或网络视频，实时显示缓冲区间、解码帧率与丢帧，并只读解析 MP4/MOV 的编码档次/级别、精确帧数、每轨码率与旋转；不注册智能体工具，不写入会话事件。"
